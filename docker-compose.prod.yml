# 그냥 3306으로 접근 불가, 3306포트가 뚫려있지 않음
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: kodyjobdam
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/kody-gsm/jobdam_backend:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/kodyjobdam
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
