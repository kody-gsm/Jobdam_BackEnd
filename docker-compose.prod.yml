# 그냥 3306으로 접근 불가, 3306포트가 뚫려있지 않음
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: kodyjobdam
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/kody-gsm/jobdam_backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/kodyjobdam?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGN: ${JWT_SIGN}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-1209600000}
      DATAGSM_API_BASE_URL: ${DATAGSM_API_BASE_URL:-https://openapi.datagsm.kr}
      DATAGSM_API_KEY: ${DATAGSM_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_BOT_CHANNEL_ID: ${DISCORD_BOT_CHANNEL_ID}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      EMAIL_CODE_EXPIRATION_MINUTES: ${EMAIL_CODE_EXPIRATION_MINUTES:-10}
      EMAIL_CODE_MAX_FAILED_ATTEMPTS: ${EMAIL_CODE_MAX_FAILED_ATTEMPTS:-5}
      EMAIL_CODE_RETENTION_DAYS: ${EMAIL_CODE_RETENTION_DAYS:-1}
      EMAIL_CODE_CLEANUP_CRON: "${EMAIL_CODE_CLEANUP_CRON:-0 0 3 * * *}"
      NOTIFICATION_CLEANUP_CRON: "${NOTIFICATION_CLEANUP_CRON:-0 0 3 * * *}"
      NOTIFICATION_CLEANUP_ZONE: ${NOTIFICATION_CLEANUP_ZONE:-Asia/Seoul}
      NOTIFICATION_DEFAULT_RETENTION_DAYS: ${NOTIFICATION_DEFAULT_RETENTION_DAYS:-90}
      NOTIFICATION_RECRUIT_RETENTION_DAYS: ${NOTIFICATION_RECRUIT_RETENTION_DAYS:-30}
      NOTIFICATION_FORM_RETENTION_DAYS: ${NOTIFICATION_FORM_RETENTION_DAYS:-30}
      NOTIFICATION_COUNSELING_RETENTION_DAYS: ${NOTIFICATION_COUNSELING_RETENTION_DAYS:-90}
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
