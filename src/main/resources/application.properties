spring.application.name=Kody-JOBDAM

server.port=8088

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SIGN}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

counseling.reservation.crypto-key=${COUNSELING_RESERVATION_CRYPTO_KEY}

app.email-verification.code-expiration-minutes=${EMAIL_CODE_EXPIRATION_MINUTES:10}
app.email-verification.max-failed-attempts=${EMAIL_CODE_MAX_FAILED_ATTEMPTS:5}
app.email-verification.retention-days=${EMAIL_CODE_RETENTION_DAYS:1}
app.email-verification.cleanup-cron=${EMAIL_CODE_CLEANUP_CRON:0 0 3 * * *}
server.error.include-message=always

app.profile-image.upload-dir=${PROFILE_IMAGE_UPLOAD_DIR:uploads/profile-images}
app.profile-image.public-path=${PROFILE_IMAGE_PUBLIC_PATH:/uploads/profile-images}
app.profile-image.max-size=${PROFILE_IMAGE_MAX_SIZE:5MB}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}

form.file.storage-path=${FORM_FILE_STORAGE_PATH:./uploads/form}
form.file.allowed-extensions=${FORM_FILE_ALLOWED_EXTENSIONS:pdf,png,jpg,jpeg,webp,gif,zip,doc,docx,ppt,pptx,hwp,hwpx,txt,md}
form.file.orphan-retention-hours=${FORM_FILE_ORPHAN_RETENTION_HOURS:24}
form.file.cleanup.cron=${FORM_FILE_CLEANUP_CRON:0 30 3 * * *}
form.file.cleanup.zone=${FORM_FILE_CLEANUP_ZONE:Asia/Seoul}

notification.cleanup.cron=${NOTIFICATION_CLEANUP_CRON:0 0 3 * * *}
notification.cleanup.zone=${NOTIFICATION_CLEANUP_ZONE:Asia/Seoul}
notification.default-retention-days=${NOTIFICATION_DEFAULT_RETENTION_DAYS:90}
notification.recruit-retention-days=${NOTIFICATION_RECRUIT_RETENTION_DAYS:30}
notification.form-retention-days=${NOTIFICATION_FORM_RETENTION_DAYS:30}
notification.counseling-retention-days=${NOTIFICATION_COUNSELING_RETENTION_DAYS:90}

datagsm.api.base-url=${DATAGSM_API_BASE_URL}
datagsm.api.key=${DATAGSM_API_KEY}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

discord.bot.token=${DISCORD_BOT_TOKEN}
discord.bot.channel-id=${DISCORD_BOT_CHANNEL_ID}

reservation.locked-periods=${RESERVATION_LOCKED_PERIODS:4교시}

neis.api.key=${NEIS_API_KEY:}
neis.cache.ttl-minutes=${NEIS_CACHE_TTL_MINUTES:60}


spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
