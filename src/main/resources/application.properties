spring.application.name=Kody-JOBDAM

server.port=8088

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SIGN}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

app.email-verification.code-expiration-minutes=${EMAIL_CODE_EXPIRATION_MINUTES:10}
app.email-verification.max-failed-attempts=${EMAIL_CODE_MAX_FAILED_ATTEMPTS:5}
app.email-verification.retention-days=${EMAIL_CODE_RETENTION_DAYS:1}
app.email-verification.cleanup-cron=${EMAIL_CODE_CLEANUP_CRON:0 0 3 * * *}
server.error.include-message=always

datagsm.api.base-url=${DATAGSM_API_BASE_URL}
datagsm.api.key=${DATAGSM_API_KEY}


spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
