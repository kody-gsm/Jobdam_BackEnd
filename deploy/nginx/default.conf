# 블루-그린 전환용 프록시 (docs/zero-downtime-deploy.md)
#
# 프론트 Nginx → 이 프록시(:8088) → app-blue 또는 app-green
# 어느 색으로 보낼지는 deploy.sh가 만드는 active_backend 파일의 $backend 값이 정한다.
# 서버에서는 deploy.sh가 이 파일을 버리는 nginx 컨테이너로 검사한 뒤 deploy/nginx-live/로 옮기고,
# 그 디렉터리가 /etc/nginx/conf.d에 붙는다.

server {
    listen 8088;
    server_tokens off;

    # 도커 내장 DNS. proxy_pass에 변수를 쓰면 요청 때 이름을 찾으므로,
    # 한쪽 색 컨테이너가 없어도 Nginx가 뜨고 reload도 실패하지 않는다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # set $backend http://app-blue:8088;  (deploy.sh가 쓴다)
    include /etc/nginx/conf.d/active_backend;

    # 스프링 multipart 한도(MULTIPART_MAX_REQUEST_SIZE 12MB)보다 크게 둔다. Nginx 기본값은 1MB다.
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Gemini 호출, 엑셀 다운로드처럼 오래 걸리는 요청이 있다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 헬스체크는 배포 스크립트가 컨테이너 안에서만 쓴다. 프론트가 붙이는 /backend 접두사도 함께 막는다.
    location ~ ^(/backend)?/actuator {
        return 404;
    }

    # SSE 알림 구독. 버퍼링하면 이벤트가 모였다가 늦게 내려가고, 읽기 타임아웃이 짧으면 연결이 끊긴다.
    # 앱의 SSE 타임아웃이 1시간이고 30초마다 heartbeat를 보낸다.
    location ~ ^(/backend)?/api/notifications/subscribe$ {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        # 앞단(프론트) Nginx도 이 헤더를 보면 이 응답을 버퍼링하지 않는다.
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass $backend;
    }
}
