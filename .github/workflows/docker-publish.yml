name: Docker Publish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

# main에 연달아 push돼도 배포가 겹치지 않게 하나씩 돌린다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kody-gsm/jobdam_backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 배포 설정 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # default.conf는 deploy.sh가 검사한 뒤 deploy/nginx-live로 옮겨 적용한다.
          source: docker-compose.prod.yml,deploy/deploy.sh,deploy/nginx/default.conf
          target: ${{ secrets.APP_DIR }}

      - name: 서버 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # 새 컨테이너 기동과 헬스체크를 기다리므로 기본 10분보다 넉넉히 둔다.
          command_timeout: 20m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ${{ secrets.APP_DIR }}
            # 블루-그린 무중단 배포. 실패해도 로그아웃은 하고, 실패 코드로 끝낸다.
            status=0
            bash deploy/deploy.sh || status=$?
            docker logout ghcr.io || true
            docker image prune -f || true
            exit $status
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
